<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: -apple-system, sans-serif; background: transparent; margin: 0; padding: 10px; display: flex; justify-content: center; }
    .card { background: #2D2B2A; color: #FAF9F6; border-radius: 12px; padding: 16px 20px; text-align: center; width: 300px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
    .date { font-size: 0.70rem; letter-spacing: 1.5px; text-transform: uppercase; color: #C5BCB3; margin-bottom: 6px; font-weight: 600; }
    .quote { font-size: 0.90rem; font-style: italic; color: #F4EFEA; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="card">
    <div class="date" id="d"></div>
    <div class="quote" id="q">Loading daily affirmation...</div>
  </div>
  <script>
    const aff = [
      "I am allowed to take space and move at my own healthy pace.",
      "My productivity does not define my inherent self-worth.",
      "Consistency over perfection, every single day.",
      "Nourishing my mind and body is my top priority.",
      "Small daily progress adds up to life-changing results."
    ];
    const t = new Date();
    document.getElementById('d').innerText = t.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
    const day = Math.floor((t - new Date(t.getFullYear(), 0, 0)) / 86400000);
    document.getElementById('q').innerText = `"${aff[day % aff.length]}"`;
  </script>
</body>
</html>
