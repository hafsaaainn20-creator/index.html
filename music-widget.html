<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Music Widget</title>
<style>
  :root{
    --pink: #f6d9e4;
    --pink-dark: #e8a8c2;
    --ink: #5b3a4a;
    --card: #fff5f8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .player {
    width: 260px;
    background: var(--card);
    border: 1px solid var(--pink-dark);
    border-radius: 18px;
    padding: 16px;
    box-shadow: 0 4px 14px rgba(232,168,194,0.35);
  }
  .art {
    width: 100%;
    height: 120px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--pink), var(--pink-dark));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    margin-bottom: 10px;
  }
  .title { font-size: 14px; font-weight: 600; color: var(--ink); text-align:center; }
  .artist { font-size: 12px; color: var(--ink); opacity: 0.7; text-align:center; margin-bottom: 10px; }
  .bar {
    width: 100%;
    height: 5px;
    background: var(--pink);
    border-radius: 4px;
    overflow: hidden;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    background: var(--pink-dark);
  }
  .times { display:flex; justify-content:space-between; font-size:10px; color:var(--ink); opacity:0.7; margin-top:-6px; margin-bottom:10px;}
  .controls { display:flex; justify-content:center; align-items:center; gap:16px; }
  .controls button {
    background: none;
    border: none;
    color: var(--ink);
    font-size: 18px;
    cursor: pointer;
  }
  .controls button.play {
    background: var(--pink-dark);
    color: white;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 16px;
  }
</style>
</head>
<body>
  <div class="player">
    <div class="art" id="art">🎵</div>
    <div class="title" id="title">that girl stu</div>
    <div class="artist" id="artist">Pomeranian</div>
    <div class="bar" id="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    <div class="controls">
      <button onclick="prevTrack()">⏮</button>
      <button class="play" id="playBtn" onclick="togglePlay()">▶</button>
      <button onclick="nextTrack()">⏭</button>
    </div>
  </div>

<audio id="audio"></audio>

<script>
  // Add your own tracks here: title, artist, and a direct link to an mp3 file
  // (your own hosting, a royalty-free library, or any direct .mp3 URL)
  const playlist = [
    { title: "that girl stu", artist: "Pomeranian", src: "" },
    { title: "prom dress", artist: "mxmtoon", src: "" },
    { title: "Love Story (Taylor's Version)", artist: "Taylor Swift", src: "" }
  ];

  let current = 0;
  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const titleEl = document.getElementById('title');
  const artistEl = document.getElementById('artist');
  const barFill = document.getElementById('barFill');
  const curEl = document.getElementById('cur');
  const durEl = document.getElementById('dur');
  const bar = document.getElementById('bar');

  function format(s) {
    if (!s || isNaN(s)) return "0:00";
    const m = Math.floor(s/60);
    const sec = Math.floor(s%60).toString().padStart(2,'0');
    return m + ":" + sec;
  }

  function loadTrack(i) {
    current = i;
    const track = playlist[current];
    titleEl.textContent = track.title;
    artistEl.textContent = track.artist;
    audio.src = track.src;
  }

  function togglePlay() {
    if (!playlist[current].src) {
      titleEl.textContent = "Add an mp3 link";
      artistEl.textContent = "Edit the playlist array in the code";
      return;
    }
    if (audio.paused) {
      audio.play();
      playBtn.textContent = "⏸";
    } else {
      audio.pause();
      playBtn.textContent = "▶";
    }
  }

  function nextTrack() {
    loadTrack((current + 1) % playlist.length);
    playBtn.textContent = "▶";
  }

  function prevTrack() {
    loadTrack((current - 1 + playlist.length) % playlist.length);
    playBtn.textContent = "▶";
  }

  audio.addEventListener('timeupdate', () => {
    if (audio.duration) {
      barFill.style.width = (audio.currentTime / audio.duration * 100) + "%";
      curEl.textContent = format(audio.currentTime);
      durEl.textContent = format(audio.duration);
    }
  });

  audio.addEventListener('ended', nextTrack);

  bar.addEventListener('click', (e) => {
    const rect = bar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    if (audio.duration) audio.currentTime = pct * audio.duration;
  });

  loadTrack(0);
</script>
</body>
</html>
